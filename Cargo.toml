[package]
name = "balzac"
version = "0.1.12"
description = "A blazingly fast static site generator"
license = "MIT"
homepage = "https://balzac.rs"
repository = "https://github.com/getbalzac/balzac"
edition = "2024"
readme = "README.md"
exclude = [
    "dist/*",
    "pages/*",
    "example/*"
]

[dependencies]
clap = {version = "4.5.54", features = ["cargo"]}
colog = "1.4.0"
# default features pull in comrak's CLI and syntect with the onig C regex engine
comrak = { version = "0.59", default-features = false }
handlebars = "6.3.2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
log = "0.4.29"
# renders pages in parallel; RAYON_NUM_THREADS caps the number of threads
rayon = "1.10"
# directive names end at Unicode punctuation (`\p{P}`, `\p{S}`); already in the tree through colog and syntect
regex = { version = "1", default-features = false, features = ["std", "unicode-gencat"] }
# used by script_helpers.rs; same version range and features as handlebars' script_helper, so it is the same crate
rhai = { version = "1.16", features = ["sync", "serde"], optional = true }
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.148"
# content hashes of fingerprinted assets (`[assets] fingerprint = true`)
sha2 = { version = "0.11", default-features = false }
shell-words = "1.1"
# "did you mean" suggestions for unknown config keys; already in the tree through clap
strsim = "0.11"
# class-based highlighting only; fancy-regex keeps the build pure Rust and smaller than onig
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
toml = "0.9.10"
thiserror = "2"

[features]
default = ["script-helpers"]
# user-defined Rhai helpers (helpers/*.rhai); adds ~2 MiB to the release binary
script-helpers = ["handlebars/script_helper", "dep:rhai"]

[dev-dependencies]
tempfile = "3.10"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# balzac exposes a library API, but its pub fns are internal plumbing for the CLI
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
