name: npm packaging

on:
    push:
        branches:
            - master
        paths:
            - "npm/**"
            - dist-workspace.toml
            - .github/workflows/npm.yml
            - .github/workflows/publish-npm.yml
    pull_request:
        branches:
            - master
        paths:
            - "npm/**"
            - dist-workspace.toml
            - .github/workflows/npm.yml
            - .github/workflows/publish-npm.yml

jobs:
    smoke_test:
        name: Smoke test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
            - run: npm/scripts/smoke-test.sh
