name: CI

on:
    push:
        branches:
            - master
        paths:
            - "**/*.rs"
            - Cargo.toml
            - Cargo.lock
            - rust-toolchain.toml
            - .github/workflows/tests.yml
    pull_request:
        branches:
            - master
        paths:
            - "**/*.rs"
            - Cargo.toml
            - Cargo.lock
            - rust-toolchain.toml
            - .github/workflows/tests.yml

env:
    CARGO_TERM_COLOR: always

jobs:
    build_and_test:
        name: Rust project - ${{ matrix.toolchain }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                toolchain:
                    - stable
                    - beta
                    - nightly
        env:
            # overrides the pin in rust-toolchain.toml
            RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        steps:
            - uses: actions/checkout@v7
            - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
            - run: cargo build --verbose
            - run: cargo test --verbose
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # installs the pinned toolchain and components from rust-toolchain.toml
            - run: rustup toolchain install
            - run: cargo fmt --all -- --check
            - run: cargo clippy --all-targets --all-features -- -D warnings
            - run: cargo clippy --all-targets --no-default-features -- -D warnings
    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # the pinned toolchain from rust-toolchain.toml, plus the LLVM tools cargo-llvm-cov needs
            - run: rustup toolchain install && rustup component add llvm-tools-preview
            - uses: taiki-e/install-action@cargo-llvm-cov
            # both feature sets are merged into one report
            - run: cargo llvm-cov --no-report
            - run: cargo llvm-cov --no-report --no-default-features
            - run: cargo llvm-cov report --lcov --output-path lcov.info
            - run: cargo llvm-cov report --html
            - name: Job summary
              run: |
                  {
                      echo '## Coverage'
                      echo '```'
                      cargo llvm-cov report --summary-only
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: |
                      lcov.info
                      target/llvm-cov/html
