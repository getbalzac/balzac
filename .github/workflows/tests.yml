name: CI

on:
    push:
        branches:
            - master
        paths:
            - "**/*.rs"
            - Cargo.toml
            - Cargo.lock
            - rust-toolchain.toml
            - .github/workflows/tests.yml
    pull_request:
        branches:
            - master
        paths:
            - "**/*.rs"
            - Cargo.toml
            - Cargo.lock
            - rust-toolchain.toml
            - .github/workflows/tests.yml

env:
    CARGO_TERM_COLOR: always

jobs:
    build_and_test:
        name: Rust project - ${{ matrix.toolchain }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                toolchain:
                    - stable
                    - beta
                    - nightly
        env:
            # overrides the pin in rust-toolchain.toml
            RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        steps:
            - uses: actions/checkout@v4
            - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
            - run: cargo build --verbose
            - run: cargo test --verbose
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # installs the pinned toolchain and components from rust-toolchain.toml
            - run: rustup toolchain install
            - run: cargo fmt --all -- --check
            - run: cargo clippy --all-targets --all-features -- -D warnings
            - run: cargo clippy --all-targets --no-default-features -- -D warnings
